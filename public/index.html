<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{SITE_TITLE}}</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#14161a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{SITE_TITLE}}" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>{{SITE_TITLE}}</h1>
    <input id="search" type="search" placeholder="Search title, artist, album..." autocomplete="off" />
    <button id="btn-rescan" class="icon-button" title="Rescan library">⟳</button>
  </header>

  <nav id="breadcrumbs" class="breadcrumbs"></nav>

  <div id="video-stage">
    <video id="video" playsinline></video>
    <button id="btn-pip" class="icon-button video-pip-btn" title="Minimize video (picture-in-picture)">⧉</button>
  </div>

  <main id="listing" class="listing"></main>

  <footer class="player-bar">
    <div class="player-track">
      <img id="player-art" class="player-art" alt="" />
      <div class="player-meta">
        <div id="player-title" class="player-title">No track selected</div>
        <div id="player-subtitle" class="player-subtitle"></div>
      </div>
    </div>

    <div class="player-controls">
      <button id="btn-prev" title="Previous">⏮</button>
      <button id="btn-play" title="Play/Pause">▶</button>
      <button id="btn-next" title="Next">⏭</button>
    </div>

    <div class="player-seek">
      <span id="time-current">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" />
      <span id="time-duration">0:00</span>
    </div>

    <div class="player-volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" value="1" step="0.01" />
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>

  <script src="js/app.js"></script>
</body>
</html>
